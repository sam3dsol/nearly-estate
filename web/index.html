<!doctype html>
<html lang="en" data-theme="black" data-ground="black">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="https://nearly.trade/favicon.svg" type="image/svg+xml" />
    <title>Nearly Estate</title>
    <script>
      // the visitor's ground pick before first paint (lib/theme.ts GROUNDS), so a saved pick never flashes the default
      try { var g = localStorage.getItem('nearly.ground.v2'); if (/^(black|tint|green|jade|ocean|emerald)$/.test(g)) document.documentElement.setAttribute('data-ground', g) } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
